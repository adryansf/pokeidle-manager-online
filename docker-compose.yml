# Uso com Dokploy ou Docker Compose local:
#   1) Defina TELEMETRY_TOKEN (chave/senha secreta de proteção do painel) e PUBLIC_URL (seu domínio HTTPS).
#   2) Suba com: docker compose up -d --build
services:
  pokeidle:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      # Para acesso local ou mapeamento direto; no Dokploy o proxy reverso (Traefik) roteia o domínio HTTPS para a porta 8080 interna.
      - "${BIND_HOST:-127.0.0.1}:${TELEMETRY_PORT:-8080}:8080"
    volumes:
      - pokeidle-data:/data
    environment:
      DATA_DIR: /data
      DAILY_FILE: /data/daily_state.json
      SESSION_FILE: /data/session_state.json
      TELEMETRY_HOST: 0.0.0.0
      TELEMETRY_PORT: "8080"
      TRUST_PROXY: "1"
      UPDATE_CHECK: "${UPDATE_CHECK:-0}"
      # Obrigatório em produção/domínio público: protege o painel desde o 1º boot (vale como senha e Bearer token).
      TELEMETRY_TOKEN: "${TELEMETRY_TOKEN:-}"
      # URL pública HTTPS do painel (ex.: https://pokeidle.seudominio.com).
      # Todo o resto (contas, proxies, Discord e Telegram) é configurado direto no Dashboard web!
      PUBLIC_URL: "${PUBLIC_URL:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pokeidle-data:
