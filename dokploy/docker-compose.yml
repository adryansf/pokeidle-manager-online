services:
  pokeidle:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - pokeidle-data:/data
    environment:
      DATA_DIR: /data
      DAILY_FILE: /data/daily_state.json
      SESSION_FILE: /data/session_state.json
      TELEMETRY_HOST: 0.0.0.0
      TELEMETRY_PORT: "8080"
      TRUST_PROXY: "1"
      UPDATE_CHECK: "0"
      TELEMETRY_TOKEN: "${TELEMETRY_TOKEN:?Defina TELEMETRY_TOKEN}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      REPORT_TZ: "${REPORT_TZ:-America/Sao_Paulo}"
      DAILY_REPORT_HOUR: "${DAILY_REPORT_HOUR:-0}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pokeidle-data:
